<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match</title>
</head>
<body>
    <script>    
    function test_str() {
        let str1 = document.getElementById("t1").value.toLowerCase().trim();

    if (str1 === "bunsen burner") {
        let str2 = document.getElementById("t2").value.toLowerCase().trim();

        if (str2 === "flask" || str2 === "erlenmeyer flask") {
            let str3 = document.getElementById("t3").value.toLowerCase().trim();

            if (str3 === "funnel") {
                let str4 = document.getElementById("t4").value.toLowerCase().trim();

                if (str4 === "wire gauze") {
                    let str5 = document.getElementById("t5").value.toLowerCase().trim();

                    if (str5 === "test tube") {
                        window.location.href="finalpage.html"
                    } else {
                        alert("Wrong!");
                    }
                } else {
                    alert("Wrong!");
                }
            } else {
                alert("Wrong!");
            }
        } else {
            alert("Wrong!");
        }
    } else {
        alert("Wrong!");
    }
}
    </script>
    <h1>Match them to move on</h1>
    <img src="pictures/burner.png">
    <input class="match" type="text" placeholder="apparatus name" autocomplete="off" id="t1">
    <br />
    <img src="pictures/flask.png">
    <input class="match type="text placeholder="apparatus name" autocomplete="off" id="t2">
    <br />
    <img src="pictures/funnel.png">
    <input class="match" type="text" placeholder="apparatus name" autocomplete="off" id="t3">
    <input class="submit" type="submit" onclick="test_str()"/>
    <br />
    <img src="pictures/gauze.png">
    <input class="match" type="text" placeholder="apparatus name" autocomplete="off" id="t4">
    <br />
    <img src="pictures/test_tube.png">
    <input class="match" type="text" placeholder="apparatus name" autocomplete="off" id="t5">
    <br />
    <link rel="stylesheet" href="style.css">
</body>
</html>
